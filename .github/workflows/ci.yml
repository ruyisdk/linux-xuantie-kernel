name: xuantie-kernel-ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  xt64_toolchain: https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource//1777015432925
  xt64_toolchain_file_name: Xuantie-900-gcc-linux-6.6.36-glibc-x86_64-V3.4.0-20260323.tar.gz
  rv32_toolchain: https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.01.23
  rv32_toolchain_file_name: riscv32-glibc-ubuntu-22.04-gcc.tar.xz
  rv64_toolchain: https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.01.23
  rv64_toolchain_file_name: riscv64-glibc-ubuntu-22.04-gcc.tar.xz
  rv64ilp32_toolchain: https://github.com/ruyisdk/riscv-gnu-toolchain-rv64ilp32/releases/download/2025.01.16
  rv64ilp32_toolchain_file_name: riscv64ilp32-elf-ubuntu-22.04-gcc-nightly-2025.01.16-nightly.tar.gz
  UPSTREAM_6_6_COMMITID: cbb31f77b879f2c1aeb5e9e69823982ef2e88efc # 6.6.121

jobs:
  kernel-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # RV64
          - name: linux-64lp64-upstream
            toolchain_variant: rv64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: defconfig
          - name: linux-64lp64-xuantie
            toolchain_variant: xt64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: xuantie_defconfig
          - name: linux-64lp64-test
            toolchain_variant: xt64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: xuantie_debug_defconfig
          - name: linux-64lp64-opensource-debug
            toolchain_variant: rv64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: xuantie_debug_defconfig

          # RV32
          - name: linux-32ilp32-upstream
            toolchain_variant: rv32_toolchain
            toolchain_prefix: riscv32-unknown-linux-gnu-
            config: rv32_defconfig
          - name: linux-32ilp32-xuantie
            toolchain_variant: xt64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: xuantie_rv32_defconfig
          - name: linux-32ilp32-test
            toolchain_variant: xt64_toolchain
            toolchain_prefix: riscv64-unknown-linux-gnu-
            config: xuantie_rv32_debug_defconfig
          - name: linux-32ilp32-opensource-debug
            toolchain_variant: rv32_toolchain
            toolchain_prefix: riscv32-unknown-linux-gnu-
            config: xuantie_rv32_debug_defconfig

          # 64ilp32
          - name: linux-64ilp32-sv39
            toolchain_variant: rv64ilp32_toolchain
            toolchain_prefix: riscv64-unknown-elf-
            config: rv64ilp32_defconfig
          - name: linux-64ilp32-sv32xt
            toolchain_variant: rv64ilp32_toolchain
            toolchain_prefix: riscv64-unknown-elf-
            config: rv64ilp32_defconfig
          - name: linux-64ilp32-test
            toolchain_variant: rv64ilp32_toolchain
            toolchain_prefix: riscv64-unknown-elf-
            config: rv64ilp32_defconfig

          # ARM64
          - name: linux-arm64-xuantie
            toolchain_variant: arm64_toolchain
            toolchain_prefix: aarch64-linux-gnu-
            config: defconfig
            arch: arm64

          # x86_64
          - name: linux-x86-xuantie
            toolchain_variant: x86_toolchain
            toolchain_prefix: ""
            config: defconfig
            arch: x86



    runs-on: ubuntu-22.04
    env:
      CROSS_COMPILE: ${{ matrix.toolchain_prefix }}

    steps:
      - name: Install software
        run: |
              sudo apt update && \
              sudo apt install -y build-essential flex bison bc libelf-dev libssl-dev dwarves ${{ matrix.toolchain_variant == 'arm64_toolchain' && 'gcc-aarch64-linux-gnu' || '' }}

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure toolchains
        run: |
              if [ x"${{ matrix.toolchain_variant }}" = x"rv32_toolchain" ]; then
                wget -qc ${rv32_toolchain}/${rv32_toolchain_file_name}
                tar -xvf ${rv32_toolchain_file_name} -C /opt
                rm -v ${rv32_toolchain_file_name}
              fi
              if [ x"${{ matrix.toolchain_variant }}" = x"rv64_toolchain" ]; then
                wget -qc ${rv64_toolchain}/${rv64_toolchain_file_name}
                tar -xvf ${rv64_toolchain_file_name} -C /opt
                rm -v ${rv64_toolchain_file_name}
              fi
              if [ x"${{ matrix.toolchain_variant }}" = x"xt64_toolchain" ]; then
                wget -qc ${xt64_toolchain}/${xt64_toolchain_file_name}
                tar -xvf ${xt64_toolchain_file_name} -C /opt
                rm -v ${xt64_toolchain_file_name}
              fi
              if [ x"${{ matrix.toolchain_variant }}" = x"rv64ilp32_toolchain" ]; then
                wget -qc ${rv64ilp32_toolchain}/${rv64ilp32_toolchain_file_name}
                tar -xvf ${rv64ilp32_toolchain_file_name} -C /opt
                rm -v ${rv64ilp32_toolchain_file_name}
              fi
              # arm64 and x86 toolchains are installed via apt or use native compiler

      # while building upstream version, remove local source, use upstream version
      - name: Set Upstream Source
        run: |
              if [ x"${{ matrix.name }}" = x"linux-32ilp32-upstream" ] || [ x"${{ matrix.name }}" = x"linux-64lp64-upstream" ] ; then
                cd ..
                wget -qc https://github.com/gregkh/linux/archive/${{ env.UPSTREAM_6_6_COMMITID }}.tar.gz
                tar zxf ${{ env.UPSTREAM_6_6_COMMITID }}.tar.gz
                cp linux-xuantie-kernel/arch/riscv/configs/defconfig linux-${{ env.UPSTREAM_6_6_COMMITID }}/arch/riscv/configs/defconfig
                rm -rf linux-xuantie-kernel
                mv linux-${{ env.UPSTREAM_6_6_COMMITID }} linux-xuantie-kernel
                cd linux-xuantie-kernel
              fi

      # patch defconfig and compile kernel source
      - name: Compile Kernel
        run: |
              export PATH="/opt/Xuantie-900-gcc-linux-6.6.36-glibc-x86_64-V3.4.0/bin:/opt/riscv/bin:$PATH"
              KARCH="${{ matrix.arch || 'riscv' }}"

              if [ x"${{ matrix.name }}" = x"linux-64ilp32-sv32xt" ]; then
                echo CONFIG_MMU_SV32=y >> arch/riscv/configs/64ilp32.config
              fi
              if [ x"${{ matrix.name }}" = x"linux-64ilp32-test" ] ; then
                scripts/kconfig/merge_config.sh -m arch/riscv/configs/64ilp32.config .github/kernel_fragments/ftrace.fragment
                mv .config arch/riscv/configs/64ilp32.config
              fi

              # opensource rv32 toolchain (GCC 15.2.0 + binutils 2.45) defaults to
              # DWARF 5, which triggers a linker bug on rv32: all exported symbols
              # get LOCAL binding, causing ~10k modpost "local symbol was exported"
              # errors when CONFIG_FUSE_FS=y. Force DWARF 4 for these jobs.
              DWARF_FLAG="-g"
              if [ x"${{ matrix.name }}" = x"linux-32ilp32-opensource-debug" ] || [ x"${{ matrix.name }}" = x"linux-64lp64-opensource-debug" ]; then
                DWARF_FLAG="-gdwarf-4"
              fi

              make ARCH=${KARCH} KCFLAGS+="-Werror ${DWARF_FLAG}" ${{ matrix.config }} all INSTALL_MOD_PATH=./modules_install modules_install INSTALL_HDR_PATH=./headers_install headers_install -j$(nproc)


      - name: Packaging Tarball
        run: |
              KARCH="${{ matrix.arch || 'riscv' }}"
              if [ -d .git ] ; then
                git log --oneline -500 > git.log
              else
                touch git.log
              fi
              if [ "$KARCH" = "x86" ]; then
                cp arch/x86/boot/bzImage ./Image
              else
                mv arch/${KARCH}/boot/Image ./
              fi
              cp Documentation/admin-guide/kdump/gdbmacros.txt ./ 2>/dev/null || touch gdbmacros.txt
              tar czvf ${{ matrix.name }}.tar.gz Image vmlinux modules_install headers_install gdbmacros.txt git.log .config

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.tar.gz
          path: ${{ matrix.name }}.tar.gz
          retention-days: 90


  xt-qemu-64lp64:
    needs: kernel-build
    runs-on: ubuntu-latest
    container: ghcr.io/ruyisdk/linux-xuantie-kernel/xuantie-qemu:test
    strategy:
      fail-fast: false
      matrix:
        # 64-bit RISC-V CPUs supported by xuantie-qemu (see qemu-system-riscv64 -cpu help).
        # Cover c906/c907/c908/c920/c925/c930/r908 families.
        cpu: [ c906fdv , c907fdvm-rv64 , c908v , c920 , c920v2 , xt-c925v-cp , xt-c930v-cp , r908fdv ]
        kernel: [ linux-64lp64-upstream , linux-64lp64-xuantie  , linux-64lp64-test ]
        include:
          - core_count: 4
          - cpu: c906fdv
            core_count: 1

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.kernel }}.tar.gz

      - name: Prepare rootfs opensbi and unpack artifacts
        run: |
              # c925 / c930 are RVA23-class cores; use the rva23 rootfs and opensbi.
              case "${{ matrix.cpu }}" in
                xt-c925v-cp|xt-c930v-cp)
                  IMAGE_DIR="${XUANTIE_LINUX_SDK}/images-rva23"
                  ;;
                *)
                  IMAGE_DIR="${XUANTIE_LINUX_SDK}/images"
                  ;;
              esac
              cp ${IMAGE_DIR}/rootfs/rootfs.xuantie-image-rv64-6.6-lite.ext4 ./rootfs_rv64.ext4
              cp ${IMAGE_DIR}/opensbi/fw_dynamic-v1.7-rv64.bin ./fw_dynamic.bin
              tar -xvf ${{ matrix.kernel }}.tar.gz
              # The modules_install/<KVER>/build and /source are absolute symlinks
              # back into the kernel build tree.  When this dir is exposed to the
              # guest via virtio-9p (mapped-xattr), those links resolve into a
              # 9p loop and trip ELOOP ("Too many levels of symbolic links")
              # during inject_modules' cp -a.  We do not need them at runtime,
              # so drop them on the host before launching QEMU.
              find ./modules_install/lib/modules -mindepth 2 -maxdepth 2 \
                   \( -name build -o -name source \) -print -delete
              # resize rootfs to have space for perf install
              e2fsck -fy ./rootfs_rv64.ext4
              resize2fs ./rootfs_rv64.ext4 2G

      - name: Run Qemu
        shell: bash
        run: |
          # Expose the workspace (which holds modules_install/ after tar -xvf)
          # to the guest via virtio-9p with mount_tag=hostshare, so the
          # xt-c930v-cp + linux-64lp64-test path can replace the in-rootfs
          # /lib/modules/<KVER>/ tree with the freshly compiled one.
          # Other (cpu, kernel) combinations simply ignore this device.
          #
          # For the test-suite combinations (xt-c925v-cp/xt-c930v-cp +
          # linux-64lp64-test) we beef up the QEMU machine: 8 vCPU, 8G RAM
          # split into two NUMA nodes, ACLINT + AIA (APLIC/IMSIC) enabled.
          # ACLINT/AIA give us a complete IRQ topology so kselftest/LTP IRQ
          # rebalance tests behave; NUMA + larger SMP help LTP misc lock /
          # mm tests pass.  Other matrix entries keep the lean defaults.
          SMP="${{ matrix.core_count }}"
          MEM="4G"
          MACHINE="virt"
          NUMA_ARGS=""
          if [[ "${{ matrix.kernel }}" == "linux-64lp64-test" \
             && ( "${{ matrix.cpu }}" == "xt-c925v-cp" || "${{ matrix.cpu }}" == "xt-c930v-cp" ) ]]; then
            SMP=8
            MEM="8G"
            MACHINE="virt,aclint=on,aia=aplic-imsic"
            NUMA_ARGS="-object memory-backend-ram,id=mem0,size=4G -object memory-backend-ram,id=mem1,size=4G -numa node,memdev=mem0,cpus=0-3,nodeid=0 -numa node,memdev=mem1,cpus=4-7,nodeid=1"
          fi
          qemu-system-riscv64 -cpu ${{ matrix.cpu }} -nographic -smp $SMP -m $MEM -M $MACHINE \
            -bios ./fw_dynamic.bin -kernel ./Image -append 'rootwait root=/dev/vda rw' \
            -drive file=./rootfs_rv64.ext4,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 \
            $NUMA_ARGS \
            -netdev user,id=net0 -device virtio-net-device,netdev=net0 \
            -fsdev local,security_model=mapped-xattr,id=fsdev0,path=$(pwd) \
            -device virtio-9p-pci,id=fs0,fsdev=fsdev0,mount_tag=hostshare \
            -monitor none -monitor none -serial telnet:localhost:5678,server &

      - name: Check Qemu Booting Kernel
        run: .github/ci_scripts/check_qemu.exp 'cat /proc/version' 180

      # Only run the full test suite (perf test) on xt-c925v-cp + linux-64lp64-test.
      # Other (cpu, kernel) combinations only need to verify the kernel boots.
      - name: Setup network and install perf
        if: ${{ matrix.cpu == 'xt-c925v-cp' && matrix.kernel == 'linux-64lp64-test' }}
        run: |
          .github/ci_scripts/check_qemu.exp 'ip link set eth0 up && udhcpc -i eth0 || dhclient eth0' 60
          # perf is a large package; 300s is too tight on first-time install in QEMU.
          .github/ci_scripts/check_qemu.exp 'apt-get update && apt-get install -y perf' 1800

      - name: Check perf test
        if: ${{ matrix.cpu == 'xt-c925v-cp' && matrix.kernel == 'linux-64lp64-test' }}
        run: |
          .github/ci_scripts/check_qemu.exp 'echo 10 > /proc/sys/kernel/perf_event_max_sample_rate' 30
          .github/ci_scripts/check_qemu.exp 'perf test -s 8,17,19,20,21,22,23,25,26,35,56,64,66,68,80,82,85,105,110' 180 FAILED

      - name: Check perf stat
        if: ${{ matrix.cpu == 'xt-c925v-cp' && matrix.kernel == 'linux-64lp64-test' }}
        run: .github/ci_scripts/check_qemu.exp 'perf stat tar -czf test.tar.gz /bin' 60 '' 'seconds sys'

      # On xt-c930v-cp + linux-64lp64-test, run the full kselftest matrix
      # (cgroup/fs/ftrace/hotplug/mm/pid/riscv/syscall) plus vcrypto-all.
      # The orchestrator:
      #   - replaces /lib/modules/<KVER>/ via 9p host-share with freshly compiled modules;
      #   - provisions runner scripts from the repo's kernel_testsuite/ via 9p;
      #   - apt-installs each test's deps then executes the runner;
      #   - re-injects compiled modules whenever apt brings in kernel-module-* pkgs.
      - name: Run xuantie test suite (kselftest/vcrypto) on c930
        if: ${{ matrix.cpu == 'xt-c930v-cp' && matrix.kernel == 'linux-64lp64-test' }}
        env:
          SKIP_BOOT: "1"
        run: |
          .github/ci_scripts/run_xt_test_suite.sh \
            --modules-dir ./modules_install \
            --filter kselftest-cgroup,kselftest-fs,kselftest-ftrace,kselftest-hotplug,kselftest-mm,kselftest-pid,kselftest-riscv,kselftest-syscall,vcrypto-all,bitops,random,perf-record

      # On xt-c925v-cp + linux-64lp64-test, run LTP container/misc test groups
      # using the same orchestrator as c930.
      - name: Run xuantie test suite (ltp container/misc) on c925
        if: ${{ matrix.cpu == 'xt-c925v-cp' && matrix.kernel == 'linux-64lp64-test' }}
        env:
          SKIP_BOOT: "1"
        run: |
          .github/ci_scripts/run_xt_test_suite.sh \
            --modules-dir ./modules_install \
            --filter ltp-container,ltp-misc


  xt-qemu-32ilp32:
    needs: kernel-build
    runs-on: ubuntu-latest
    container: ghcr.io/ruyisdk/linux-xuantie-kernel/xuantie-qemu:test
    strategy:
      fail-fast: false
      matrix:
        cpu: [ c907fdvm-rv32 ]
        kernel: [ linux-32ilp32-upstream , linux-32ilp32-xuantie , linux-32ilp32-test ]


    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.kernel }}.tar.gz

      - name: Prepare rootfs opensbi and unpack artifacts
        run: |
              wget -qc https://github.com/c-sky/buildroot/releases/download/v1.0.11/rootfs_rv32.ext2.tar.gz
              tar -xvf rootfs_rv32.ext2.tar.gz
              cp ${XUANTIE_LINUX_SDK}/images/opensbi/fw_dynamic-v1.7-rv32.bin ./fw_dynamic.bin
              tar -xvf ${{ matrix.kernel }}.tar.gz

      - name: Run Qemu
        run: qemu-system-riscv32 -cpu ${{ matrix.cpu }} -nographic -smp 4 -M virt -bios ./fw_dynamic.bin -kernel ./Image -append 'rootwait root=/dev/vda ro' -drive file=./rootfs_rv32.ext2,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 -monitor none -serial telnet:localhost:5678,server &

      - name: Check Qemu Booting Kernel
        run: .github/ci_scripts/check_qemu.exp 'cat /proc/version' 180

      - name: Check perf test
        run: .github/ci_scripts/check_qemu.exp 'perf test -s 5,15,16,17,18,21,50,60,62' 180 FAILED

      - name: Check perf stat
        run: .github/ci_scripts/check_qemu.exp 'perf stat tar -czf test.tar.gz /bin' 60 '' seconds sys


  ruyi-qemu-64ilp32:
    needs: kernel-build
    runs-on: ubuntu-latest
    container: ghcr.io/ruyisdk/linux-xuantie-kernel/ruyi-toolchain:latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ Image ]
        kernel: [ linux-64ilp32-sv39 , linux-64ilp32-test ]
        include:
          - cpu: rv64

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.kernel }}.tar.gz

      - name: Download rootfs and unpack artifacts
        run: |
              wget -qc https://github.com/c-sky/buildroot/releases/download/v1.0.11/rootfs_rv32.ext2.tar.gz
              tar -xvf rootfs_rv32.ext2.tar.gz
              tar -xvf ${{ matrix.kernel }}.tar.gz

      - name: Run Qemu
        run: qemu-system-riscv64 -cpu ${{ matrix.cpu }} -nographic -smp 4 -M virt -kernel ./${{ matrix.variant }} -append 'rootwait root=/dev/vda ro' -drive file=./rootfs_rv32.ext2,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 -monitor none -serial telnet:localhost:5678,server &

      - name: Check Qemu Booting Kernel
        run: .github/ci_scripts/check_qemu.exp 'cat /proc/version' 180

      - name: Check perf test
        run: .github/ci_scripts/check_qemu.exp 'perf test -s 5,15,16,17,18,21,50,60,62' 180 FAILED

      - name: Check perf stat
        run: .github/ci_scripts/check_qemu.exp 'perf stat tar -czf test.tar.gz /bin' 60 '' seconds sys

  checkpatch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: 'Calculate PR commits + 1'
      run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> $GITHUB_ENV
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: ${{ env.PR_FETCH_DEPTH }}
    - name: Run checkpatch review
      uses: webispy/checkpatch-action@v9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
